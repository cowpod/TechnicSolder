volumes:
  db:
  config:
  mods:
  forges:
  others:
  redis_data:

networks:
  default:

services:
  redis:
    image: redis:8-alpine
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - default
    container_name: solder-redis
  db:
    image: mariadb:lts
    restart: always
    volumes:
      - db:/var/lib/mysql:Z
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=1
      - MYSQL_PASSWORD=solder
      - MYSQL_DATABASE=solder
      - MYSQL_USER=solder
    networks:
      - default
    container_name: solder-db
  app:
    build:
      dockerfile: Dockerfile
    restart: always
    ports:
      - 80:80
    environment:
      - CACHE=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - config:/var/www/html/config
      - mods:/var/www/html/mods
      - forges:/var/www/html/forges
      - others:/var/www/html/others
    depends_on:
      - db
      - redis
    networks:
      - default
    container_name: solder-app
